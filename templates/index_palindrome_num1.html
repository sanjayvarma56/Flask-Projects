<!DOCTYPE html>
<html>
    <title>Palindrome Number Checker</title>
    <head>
        <h1>Palindrome Number Checker</h1>
        <form method ="POST">
            <label for="number">Enter a number:</label>
            <input type="number" name="number">
            <button type="submit">Check</button>
        </form>
        {% if result is not none %}
            <p>{{ result }}</p>
        {% endif %}
    </head>
</html>
