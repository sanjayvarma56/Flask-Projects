<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>
</head>
<body>
    <h1>Age Calculator</h1>
    <form method="POST">
        <label for="birth_year">Enter your birth year:</label>
        <input type="number" id="birth_year" name="birth_year">
        <button type="submit">Calculate Age</button>
    </form>
    {% if age is not none %}
        <p>Your age is: {{ age }}</p>
    {% endif %}
</body>
</html>
