<!DOCTYPE html>
<html>
<head>
    <title> Palindrome Checker </title>
</head>
<body>
    <h1>Palindrome Checker</h1>
    <form method = "POST">
        <label>
            Enter a word or phrase:
            <input type = "text" name = "word">
            <button type = "submit">Check</button>
        </label>
    </form>
    {% if result is not none %}
        <p>{{ result }}</p>
    {% endif %}
</body>
</html>
